# WorkoutOrganizer — quatro containers, uma porta publicada.
#
#   nginx (gateway, :79)
#     ├── /                      -> frontend
#     └── /api, /images, /videos -> backend
#                                      └── document-service
#
# Networks:
#   web      -> cloudflared <-> nginx
#   internal -> nginx <-> frontend/backend/document-service
#
#   docker compose up -d --build

name: workoutorganizer

services:

  nginx:
    build: ./nginx

    networks:
      web:
        aliases:
          - workout-nginx
      internal:

    ports:
      - "79:79"

    depends_on:
      - frontend
      - backend

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""

    networks:
      - internal

    restart: unless-stopped


  backend:
    build: ./backend

    networks:
      - internal

    env_file:
      - ./backend/WorkoutOrganizer.Api/.env

    environment:
      DocumentService__BaseUrl: http://document-service:5200

    volumes:
      - type: bind
        source: ./workout.db
        target: /app/workout.db
        bind:
          create_host_path: false

      - ./images:/app/images:ro
      - ./videos:/app/videos:ro

    depends_on:
      - document-service

    restart: unless-stopped


  document-service:
    build: ./document-service

    networks:
      - internal

    env_file:
      - path: ./document-service/.env
        required: false

    environment:
      HOST: 0.0.0.0
      PORT: "5200"

    volumes:
      - type: bind
        source: ./workout.db
        target: /app/workout.db
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5200/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    restart: unless-stopped


networks:

  # Network já existente no seu homelab.
  # O cloudflared também está conectado nela.
  web:
    external: true

  # Rede privada criada pelo Compose.
  internal:
    driver: bridge

# Servidor estático do SPA. Só é alcançado pelo gateway (nginx/), nunca direto.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Bundles do Vite têm hash no nome: podem ficar em cache indefinidamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache, senão um deploy novo continua apontando para bundles antigos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

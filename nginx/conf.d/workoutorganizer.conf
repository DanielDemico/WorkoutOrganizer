# Gateway do WorkoutOrganizer.
#
#   /api/, /images/, /videos/  ->  backend (ASP.NET Core, :5199)
#   /openapi/, /scalar/        ->  backend (só respondem com ASPNETCORE_ENVIRONMENT=Development)
#   tudo o mais                ->  frontend (nginx estático do SPA, :80 interno)
#
# O document-service não aparece aqui de propósito: o browser nunca fala com ele,
# só a API (POST /api/workouts/import) — ele fica restrito à rede do compose.

# DNS interno do Docker. Resolver em tempo de execução (e não no boot do nginx)
# deixa o gateway subir mesmo que backend/frontend ainda estejam reiniciando,
# e acompanha a troca de IP quando um deles é recriado.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    # Diferente de 80: já existe outro serviço nessa porta no servidor.
    # A porta do host é definida no compose (NGINX_PORT); esta é a interna.
    listen 8080;
    server_name _;

    # Import de ficha aceita até 15 MB (WorkoutsController.MaxFileSizeBytes);
    # o default do nginx é 1m e devolveria 413 antes de chegar à API.
    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/(api|images|videos|openapi|scalar)(/|$) {
        set $backend backend:5199;
        proxy_pass http://$backend;

        # A API espera até 90 s pelo document-service (HttpClient.Timeout); o
        # default de 60 s do nginx cortaria a importação de ficha no meio.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        set $frontend frontend:80;
        proxy_pass http://$frontend;
    }
}
